services:
  - type: web
    name: thelivlens
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL_ID
        value: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: truthlens
    healthCheckPath: /api/health
    autoDeploy: true
